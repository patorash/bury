name: Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - ruby: '2.7'
            gemfile: 'ruby3.0_and_below'
          - ruby: '3.0'
            gemfile: 'ruby3.0_and_below'
          - ruby: '3.1'
            gemfile: 'ruby3.1_and_above'
          - ruby: '3.2'
            gemfile: 'ruby3.1_and_above'
          - ruby: '3.3'
            gemfile: 'ruby3.1_and_above'
          - ruby: '3.4'
            gemfile: 'ruby3.1_and_above'
          - ruby: '4.0'
            gemfile: 'ruby3.1_and_above'
    env:
      BUNDLE_GEMFILE: ${{ github.workspace }}/gemfiles/${{ matrix.gemfile }}.gemfile

    steps:
      - uses: actions/checkout@v2
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
          rubygems: 'latest'
      - name: Run tests
        run: bundle exec rake
